<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodies World</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
   
    <style>
        body{
          background: url(images/bg1.jpg);
        }
        .conthead{
          width:100%;
          background-color: rgba(250, 235, 215,0.5);
          height:10vh;
          color:black;
          font-weight: bold;
         
          display:grid;
          justify-content: center;
          align-items: center;
          font-size: 30px;
        }
        .contact{
          width:500px;
          margin:auto;
        /*  background-color: rgba(95, 158, 160,0.7);*/
        background-color: rgba(250, 235, 215,0.5);
          display:grid;
          grid-template-columns: 1fr ;
          gap:20px;
          padding:30px;
         margin-top:20px;
          border-radius:30px;

        }
        .inside{
          width:100%;
          height:100px;
          background-color: rgba(240, 248, 255,0.8);
          display:grid;
           grid-template-columns: 1fr 1fr 1fr;
           border-radius:10px;
        }
       
        .inside h4{
           color:rgb(107, 107, 107);
           padding-left:6px;
           padding-top:8px;
           grid-column: span 4;
        }
        .inside h{
         
          grid-column: span 2;
          font-size: 15px;
          font-weight: bold;
           padding-left:8px;
          width:100%;
         
        }
           .gg-user{
               grid-column: 3/5;
              
               width:35px;
               height:35px;
               justify-self:center ;
           }
       @media (max-width:850px){
          .contact{
            height:550px;
            width:300px;
            margin:auto;
            margin-top:15vh;
            margin-bottom:15vh;
          }
          .inside{
            height:auto;
            width:auto;
          }
        }
    </style>
</head>
<body>
  <div class="conthead">
    <h>CONTACT US</h>
  </div>
   <div class="contact">
    <div class="name inside">
      <h4>NAME</h4>
      <h>Foodies World </h>
      <img class="gg-user" src="images/user.png"></img>
    </div>
    <div class="add inside">
      <h4>ADDRESS</h4>
      <h>1717 Harrison St, San Francisco, CA 94103, United States</h>
      <a class="gg-user" href="https://maps.app.goo.gl/qp8t7scFoXyTXAUn9"><img class="gg-user" src="images/location.png"></img></a>
    </div>
    <div class="mail inside">
      <h4>MAIL ID</h4>
      <h>foodieparadise@gmail.com</h>
      <a class="gg-user" href="https://mail.google.com/mail/?view=cm&fs=1&tf=1&to=foodieparadise@gmail.com" target="_blank"> <img class="gg-user" src="images/email.png"></img></a>
    </div>
    
    <div class="phno inside">
      <h4>PHONE NUMBER</h4>
      <h>987662727</h>
      <img class="gg-user" src="images/call.png"></img>

    </div>
   </div>
</body>
</html>
